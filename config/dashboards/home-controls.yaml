              left: 19.0000%
              top: 2.0000%
              width: 34.0000%
              transform: translate(-50%, 0)
              --ha-card-background: '#ffffff'
              --ha-card-border-color: '#dce4ec'
              --ha-card-border-radius: 16px
              --primary-text-color: '#172b40'
              --secondary-text-color: '#607286'
          - type: state-icon
            entity: climate.main_bedroom_hoof_slaapkamer_aircon
            icon: mdi:air-conditioner
            title: Main bedroom aircon
            state_color: true
            tap_action:
              action: more-info
            hold_action:
              action: more-info
            style:
              left: 27.5000%
              top: 25.1193%
              background: rgba(255, 255, 255, 0.96)
              border-radius: 50%
              padding: 12px
              box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3)
