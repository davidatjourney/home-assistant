title: Home controls
views:
- title: Devices
  path: devices
  icon: mdi:home-outline
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: weather-forecast
      entity: weather.forecast_home
      name: Home weather
      show_current: true
      show_forecast: true
      forecast_type: daily
      grid_options:
        columns: 12
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Combined solar
      icon: mdi:solar-power
    - type: tile
      entity: sensor.combined_solar_system_pv_total_power
      name: Solar now
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: sensor.combined_solar_system_load_total_power
      name: House now
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: sensor.combined_solar_system_battery_soc
      name: Battery
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: sensor.combined_solar_system_battery_power
      name: Battery power
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: sensor.combined_solar_system_grid_power
      name: Grid power
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: sensor.combined_solar_system_pv_generation_today
      name: Solar generated
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: sensor.combined_solar_system_load_energy_used_today
      name: House used
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: sensor.combined_solar_system_grid_import_today
      name: Grid imported
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: sensor.combined_solar_system_grid_export_today
      name: Grid exported
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: sensor.combined_solar_system_battery_charge_today
      name: Battery charged
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: sensor.combined_solar_system_battery_discharge_today
      name: Battery discharged
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: sensor.home_dashboard_battery_flow
      name: Battery flow
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: sensor.home_dashboard_grid_flow
      name: Grid flow
      grid_options:
        columns: 6
        rows: 1
  - type: grid
    cards:
    - type: heading
      heading: Around the house
      icon: mdi:home-outline
    - type: tile
      color: green
      entity: switch.garage_ligte_switch_1
      name: Garage lights
      icon: mdi:outdoor-lamp
      features_position: inline
      features:
      - type: toggle
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      color: green
      entity: switch.geyser_switch_1
      name: Geyser
      icon: mdi:water-boiler
      features_position: inline
      features:
      - type: toggle
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      color: green
      entity: switch.pool_switch_1
      name: Pool
      icon: mdi:pool
      features_position: inline
      features:
      - type: toggle
      grid_options:
        columns: 12
        rows: 1
  - type: grid
    cards:
    - type: heading
      heading: Daniel's Room
      icon: mdi:bed-outline
    - type: thermostat
      entity: climate.bedroom_kitchen_daniel_aircon
      name: Daniël Aircon
      features:
      - type: climate-hvac-modes
        style: dropdown
      grid_options:
        columns: 12
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Mika and Dave's Room
      icon: mdi:bed-outline
    - type: thermostat
      entity: climate.dave_en_miks_dave_en_miks_air_conditioner
      name: Air conditioner
      features:
      - type: climate-hvac-modes
        style: dropdown
      grid_options:
        columns: 12
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Main Bedroom
      icon: mdi:bed-king-outline
    - type: thermostat
      entity: climate.main_bedroom_hoof_slaapkamer_aircon
      name: Air conditioner
      features:
      - type: climate-hvac-modes
        style: dropdown
      grid_options:
        columns: 12
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Pool stats
      icon: mdi:pool
    - type: tile
      entity: sensor.pool_power
      name: Power now
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: sensor.solar_pool_energy_today
      name: Energy today
      grid_options:
        columns: 6
        rows: 1
  - type: grid
    cards:
    - type: heading
      heading: Geyser stats
      icon: mdi:water-boiler
    - type: tile
      entity: sensor.geyser_power
      name: Power now
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: sensor.geyser_energy_today
      name: Energy today
      grid_options:
        columns: 6
        rows: 1
- title: Floor plan
  path: floor-plan
  icon: mdi:floor-plan
  type: panel
  cards:
  - type: vertical-stack
    cards:
    - type: conditional
      conditions:
      - condition: screen
        media_query: '(min-width: 1280px)'
      card:
        type: custom:viewport-fit-card
        width: 1110
        height: 1140
        card:
          type: picture-elements
          image: /local/floorplans/house-clean.svg?v=3
          elements:
          - type: custom:home-weather
