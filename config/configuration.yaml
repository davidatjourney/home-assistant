
# Loads default set of integrations. Do not remove.
default_config:

# Tell it that we will be using packages
homeassistant:
  packages: !include_dir_named packages

# Load frontend themes from the themes folder
frontend:
  extra_module_url:
    - /local/viewport-fit-card.js?v=4
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Version-controlled dashboard; existing UI dashboards remain available.
lovelace:
  mode: storage
  dashboards:
    home-controls:
      mode: yaml
      title: Home controls
      icon: mdi:home-outline
      show_in_sidebar: true
      filename: dashboards/home-controls.yaml
